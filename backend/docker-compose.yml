version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: z-home-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/z-home
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
    networks:
      - z-home-network
    volumes:
      - ./logs:/app/logs

  mongo:
    image: mongo:7
    container_name: z-home-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=z-home
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - z-home-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/z-home --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: z-home-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - z-home-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: MongoDB Express (for database management)
  mongo-express:
    image: mongo-express:latest
    container_name: z-home-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - z-home-network
    profiles:
      - tools

  # Optional: Redis Commander (for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: z-home-redis-commander
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - z-home-network
    profiles:
      - tools

volumes:
  mongo-data:
  redis-data:

networks:
  z-home-network:
    driver: bridge

